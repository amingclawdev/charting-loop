name: validate charting-loop artifacts

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve immutable-history base
        id: history-base
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="${{ github.event.before }}"
          fi
          if [[ -z "$base_sha" || "$base_sha" =~ ^0{40}$ ]]; then
            if base_sha="$(git rev-parse HEAD^ 2>/dev/null)"; then
              echo "::warning::Event has no usable before SHA; checking immutable history against HEAD^."
            else
              base_sha=""
              echo "::warning::No prior commit exists; immutable-history comparison is unavailable for this initial push."
            fi
          fi
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
          [[ -n "$base_sha" ]] && echo "available=true" >> "$GITHUB_OUTPUT" || echo "available=false" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 demos/service-plan-corridor-e2e/run_demo.py --check
      - run: python3 -m unittest discover -s tests -v
      - run: python3 tools/corridor_registry.py validate-theory
      - run: python3 tools/corridor_registry.py validate-task
      - run: python3 tools/corridor_registry.py validate-method
      - run: python3 tools/corridor_registry.py validate-corridor templates/corridor --allow-template
      - run: python3 tools/corridor_registry.py validate-corridor templates/legacy-corridor-v1 --allow-template
      - run: python3 tools/corridor_registry.py validate-registry
      - run: python3 tools/corridor_registry.py build-index --check
      - run: python3 tools/exogenous_registry.py validate-run templates/run --allow-template
      - name: Validate exogenous registry and generated index
        shell: bash
        run: |
          base_args=()
          if [[ "${{ steps.history-base.outputs.available }}" == "true" ]]; then
            base_args=(--base-ref "${{ steps.history-base.outputs.sha }}")
          fi
          python3 tools/exogenous_registry.py validate-registry "${base_args[@]}"
          python3 tools/exogenous_registry.py build-index --check "${base_args[@]}"
